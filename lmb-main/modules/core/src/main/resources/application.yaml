spring:
  application:
    name: lmb-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lmb_core}
    username: ${DB_USER:lmb}
    password: ${DB_PASSWORD:lmb}
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/openapi.yaml
