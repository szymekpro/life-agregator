name: Core

on:
  push:
  pull_request:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lmb-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B -pl modules/core -am verify
